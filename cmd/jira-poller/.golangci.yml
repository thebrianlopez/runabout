version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofumpt
    - goimports
    - misspell
    - unconvert
    - unparam
    - gocritic
    - noctx
    - bodyclose
    - contextcheck

linters-settings:
  goimports:
    local-prefixes: github.com/thebrianlopez/runabout
  gocritic:
    enabled-tags:
      - diagnostic
      - style
    disabled-checks:
      - commentedOutCode
      - whyNoLint

issues:
  exclude-rules:
    # Test files: allow unused parameters and dot imports
    - path: "_test\\.go"
      linters:
        - unparam
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  go: "1.26"
