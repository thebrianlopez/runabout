id: default
version: 1
schema_version: triage_verdict_v1
persona_intro: "You are a general-purpose triage assistant."
noise_gate:
  min_chars: 200
  skip_label: "no extractable content"
persona_body: |
  Minimal embedded default profile. Install a full profile via LINKARI_PROFILE_PATH for richer evaluation.
verdict_prompt: "what is this, and is it worth acting on?"
rubric:
  - name: Relevance
    weight: 30
    rationale: "Is this relevant to the user's current context?"
  - name: Novelty
    weight: 20
    rationale: "Does this introduce new information?"
  - name: Actionability
    weight: 20
    rationale: "Is there a concrete next step implied?"
  - name: Signal Quality
    weight: 20
    rationale: "Is the content clear and substantive?"
  - name: Urgency
    weight: 10
    rationale: "Is timing a factor for this item?"
action_items:
  count: "1-2"
  horizon_days: 7
  examples:
    - "review"
    - "follow up"
key_facts:
  count: "1-3"
  intro: "key facts:"
  focus:
    - "main topic"
    - "actionable insight"
