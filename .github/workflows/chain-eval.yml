name: chain-eval

on:
  push:
    paths:
      - 'cmd/chain-eval/**'
      - 'docs/core/prompts/command_chain.md'
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Single fixture to run (leave empty for all)'
        required: false
        default: ''
      min_score:
        description: 'Minimum passing score (default: 0.85)'
        required: false
        default: '0.85'

# Required for OIDC token exchange with AWS
permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # docs-core S3 git remote  -  git-remote-s3 bundle repo
  DOCS_CORE_S3: ${{ secrets.DOCS_CORE_S3 }}
  # AWS role assumed via OIDC for both S3 docs clone and Secrets Manager
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  AWS_REGION: us-east-1

jobs:
  build-and-dry-run:
    name: Build and validate fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build chain-eval
        run: go build -o bin/chain-eval ./cmd/chain-eval

      - name: Dry run (validate fixtures, no API keys required)
        env:
          CHAIN_FIXTURES_DIR: cmd/chain-eval/fixtures
        run: ./bin/chain-eval --all --dry-run

  eval:
    name: Run chain eval
    runs-on: ubuntu-latest
    needs: build-and-dry-run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install git-remote-s3
        run: pip install git-remote-s3

      - name: Clone docs-core from S3
        # git-remote-s3 reads bundle files under refs/heads/main/ and HEAD from S3.
        # No credentials needed beyond what configure-aws-credentials already set.
        # Clones into docs-core/ at repo root; CHAIN_PROMPTS_DIR points here.
        run: git clone "$DOCS_CORE_S3" docs-core

      - name: Build chain-eval
        run: go build -o bin/chain-eval ./cmd/chain-eval

      - name: Run chain eval (all fixtures)
        if: github.event.inputs.fixture == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          # docs-core repo layout: prompts/command_chain.md (no core/ prefix)
          CHAIN_PROMPTS_DIR: docs-core/prompts
          CHAIN_FIXTURES_DIR: cmd/chain-eval/fixtures
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "⚠ ANTHROPIC_API_KEY not set  -  skipping live eval"
            exit 0
          fi
          MIN_SCORE="${{ github.event.inputs.min_score || '0.85' }}"
          ./bin/chain-eval --all --min-score "$MIN_SCORE"

      - name: Run chain eval (single fixture)
        if: github.event.inputs.fixture != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          CHAIN_PROMPTS_DIR: docs-core/prompts
          CHAIN_FIXTURES_DIR: cmd/chain-eval/fixtures
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "⚠ ANTHROPIC_API_KEY not set  -  skipping live eval"
            exit 0
          fi
          MIN_SCORE="${{ github.event.inputs.min_score || '0.85' }}"
          ./bin/chain-eval --fixture "${{ github.event.inputs.fixture }}" --min-score "$MIN_SCORE"
