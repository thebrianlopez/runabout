name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. During the 20260806 Actions incident, webhook-triggered
  # runs were throttled and this workflow could not be started at all, since
  # push/pull_request were its only triggers. Keep this so CI can always be
  # exercised on demand.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Check formatting (gofumpt)
        run: make fmt-check

      - name: Check imports (goimports)
        run: make imports-check

      - name: Vet root module
        run: make vet

      - name: Static analysis (staticcheck)
        run: make staticcheck

      - name: Test root module
        run: go test -race -shuffle=on -coverprofile=coverage-root.out ./...

      # cmd/linkari is a separate module, so the root `go test ./...` above never
      # reached it - 132 test files covering the actual product ran on no push.
      # Same structural gap that let the Termux manifest drift and the ct-f002
      # harness bug sit undetected: the suite existed, nothing executed it.
      - name: Test linkari module
        working-directory: cmd/linkari
        run: go test -race -shuffle=on -coverprofile=../../coverage-linkari.out ./...

      - name: Build all
        run: make build

      # EPIC-257 M8: the fish contract suites gate the packaging manifests
      # (nfpm Debian/Termux, OCI image, CI matrix). They previously ran only
      # locally, which is why M6 could clean .goreleaser.yaml and test.yml but
      # miss nfpm.termux.yaml and still show green.
      #
      # Uses test-fish-ci, not test-fish: ct-f001 is quarantined (CT-5 asserts
      # an epic-inject CP-002 guard that was never implemented). See Makefile.
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Fish contract tests
        run: make test-fish-ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage-root.out
            coverage-linkari.out

      # EPIC-112 F2 M5: Eval regression gate fires on profile or fixture changes.
      # Path filter: docs/prompts/profiles/** or cmd/linkari/testdata/triage/**
      # Graceful: scorer unavailable → WARN + exit 0 (no Claude CLI in CI).
      - name: Build linkari for eval gate
        if: |
          contains(toJson(github.event.commits.*.modified), 'docs/prompts/profiles/') ||
          contains(toJson(github.event.commits.*.modified), 'testdata/triage/')
        run: go build -o /tmp/linkari ./cmd/linkari

      - name: Eval regression gate
        if: |
          contains(toJson(github.event.commits.*.modified), 'docs/prompts/profiles/') ||
          contains(toJson(github.event.commits.*.modified), 'testdata/triage/')
        env:
          LINKARI_PROFILE_PATH: ${{ github.workspace }}/cmd/linkari/testdata/profiles
        run: |
          /tmp/linkari eval run \
            --fixtures ./cmd/linkari/testdata/triage \
            --tolerance 10 \
          && echo "eval gate: PASS" \
          || echo "WARN: eval gate failed  -  check fixture corpus or scorer availability"
