name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. During the 20260806 Actions incident, webhook-triggered
  # runs were throttled and this workflow could not be started at all, since
  # push/pull_request were its only triggers. Keep this so CI can always be
  # exercised on demand.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Check formatting (gofumpt)
        run: make fmt-check

      - name: Check imports (goimports)
        run: make imports-check

      - name: Vet root module
        run: make vet

      - name: Static analysis (staticcheck)
        run: make staticcheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Test root module
        run: go test -race -shuffle=on -coverprofile=coverage-root.out ./...

      # cmd/linkari is a separate module, so the root `go test ./...` above never
      # reached it - 132 test files covering the actual product ran on no push.
      # Same structural gap that let the Termux manifest drift and the ct-f002
      # harness bug sit undetected: the suite existed, nothing executed it.
      #
      # NON-GATING until EPIC-258. The first -race run of this module surfaced
      # 3 pre-existing data races in production code (server_score.go:63 written,
      # EPIC-258: package-scoped scoring seams were removed and the race gate
      # is now required. Do not make this non-gating without an explicit,
      # documented quarantine owner and remediation epic.
      - name: Test linkari module
        working-directory: cmd/linkari
        # -timeout 20m: the -race suite runs ~5m locally but ~10m on hosted
        # runners; the go test default of 10m produced a spurious alarm panic
        # mid-test (run 31669681789).
        run: go test -race -shuffle=on -timeout 20m -coverprofile=../../coverage-linkari.out ./...

      # EPIC-258 M4: goroutine-leak gate. Runs the linkari module under the
      # leakcheck build tag (goleak.Find after m.Run; see main_leakcheck_test.go).
      # Gating from day one: the suite was verified 5x clean at enablement.
      - name: Leakcheck linkari module
        working-directory: cmd/linkari
        run: go test -tags leakcheck -count=1 -timeout 20m ./...

      - name: Build all
        run: make build

      # EPIC-257 M8: the fish contract suites gate the packaging manifests
      # (nfpm Debian/Termux, OCI image, CI matrix). They previously ran only
      # locally, which is why M6 could clean .goreleaser.yaml and test.yml but
      # miss nfpm.termux.yaml and still show green.
      #
      # Uses test-fish-ci, not test-fish: ct-f001 is quarantined (CT-5 asserts
      # an epic-inject CP-002 guard that was never implemented). See Makefile.
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Fish contract tests
        run: make test-fish-ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage-root.out
            coverage-linkari.out

      # EPIC-112 F2 M5: Eval regression gate fires on profile or fixture changes.
      # Path filter: docs/prompts/profiles/** or cmd/linkari/testdata/triage/**
      # Graceful: scorer unavailable → WARN + exit 0 (no Claude CLI in CI).
      - name: Build linkari for eval gate
        if: |
          contains(toJson(github.event.commits.*.modified), 'docs/prompts/profiles/') ||
          contains(toJson(github.event.commits.*.modified), 'testdata/triage/')
        run: go build -o /tmp/linkari ./cmd/linkari

      - name: Eval regression gate
        if: |
          contains(toJson(github.event.commits.*.modified), 'docs/prompts/profiles/') ||
          contains(toJson(github.event.commits.*.modified), 'testdata/triage/')
        env:
          LINKARI_PROFILE_PATH: ${{ github.workspace }}/cmd/linkari/testdata/profiles
        run: |
          /tmp/linkari eval run \
            --fixtures ./cmd/linkari/testdata/triage \
            --tolerance 10 \
          && echo "eval gate: PASS" \
          || echo "WARN: eval gate failed  -  check fixture corpus or scorer availability"

  module-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      # Published modules keep explicit test coverage. Retained modules stay
      # outside the aggregate build, but still get an explicit compile check so
      # CI notices breakage without reviving the shipping surface.
      - name: Test ghwatch
        working-directory: cmd/ghwatch
        run: go test -shuffle=on ./...

      - name: Test jira-poller
        working-directory: cmd/jira-poller
        run: go test -shuffle=on ./...

      - name: Test linkari-labeler
        working-directory: cmd/linkari-labeler
        run: go test -shuffle=on ./...

      - name: Test runway
        working-directory: cmd/runway
        run: go test -shuffle=on ./...

      - name: Test ts-go
        working-directory: cmd/ts-go
        run: go test -shuffle=on ./...

      - name: Build bmux (retained)
        working-directory: cmd/bmux
        run: go build ./...

      - name: Build plaid-service (retained)
        working-directory: cmd/plaid-service
        run: go build ./...

      - name: Build protonexport (retained)
        working-directory: cmd/protonexport
        run: go build ./...

      - name: Build protonexport/go-proton-api (retained)
        working-directory: cmd/protonexport/go-proton-api
        env:
          GOWORK: off
        run: go build ./...

      - name: Build wasend (retained)
        working-directory: cmd/wasend
        run: go build ./...
