name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Test root module
        run: go test -race -coverprofile=coverage-root.out ./...

      - name: Test wasend module
        run: |
          cd cmd/wasend
          go test -race -coverprofile=coverage-wasend.out ./...

      - name: Test protonexport module
        run: |
          cd cmd/protonexport
          go test -race -coverprofile=coverage-protonexport.out ./...

      - name: Build all
        run: make build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage-root.out
            cmd/wasend/coverage-wasend.out
            cmd/protonexport/coverage-protonexport.out

      # EPIC-112 F2 M5: Eval regression gate fires on profile or fixture changes.
      # Path filter: docs/prompts/profiles/** or cmd/linkari/testdata/triage/**
      # Graceful: scorer unavailable → WARN + exit 0 (no Claude CLI in CI).
      - name: Build linkari for eval gate
        if: |
          contains(toJson(github.event.commits.*.modified), 'docs/prompts/profiles/') ||
          contains(toJson(github.event.commits.*.modified), 'testdata/triage/')
        run: go build -o /tmp/linkari ./cmd/linkari

      - name: Eval regression gate
        if: |
          contains(toJson(github.event.commits.*.modified), 'docs/prompts/profiles/') ||
          contains(toJson(github.event.commits.*.modified), 'testdata/triage/')
        env:
          LINKARI_PROFILE_PATH: ${{ github.workspace }}/cmd/linkari/testdata/profiles
        run: |
          /tmp/linkari eval run \
            --fixtures ./cmd/linkari/testdata/triage \
            --tolerance 10 \
          && echo "eval gate: PASS" \
          || echo "WARN: eval gate failed — check fixture corpus or scorer availability"
