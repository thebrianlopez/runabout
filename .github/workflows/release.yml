name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # required for OIDC / Workload Identity Federation (AWS ECR push)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    # macOS required for ts-go (CGo + tree-sitter). CGO_ENABLED=0 tools
    # cross-compile to linux from macOS via goreleaser's cross-compilation.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticates via OIDC (Workload Identity Federation) - no stored AWS credentials.
      # Role: github-actions-runabout (thebrianlopez/runabout repo trust, ecr-push policy).
      # Configured in terraform/github-oidc.tf + terraform/ecr.tf.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::082515828319:role/github-actions-runabout
          role-session-name: runabout-release-${{ github.ref_name }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Generate a short-lived installation token (1h TTL) scoped to
      # homebrew-runabout only. Replaces the long-lived PAT approach.
      # App requires Contents:write on thebrianlopez/homebrew-runabout.
      # Setup: github.com/settings/apps → new app → store app ID in
      # vars.HOMEBREW_TAP_APP_ID and private key in secrets.HOMEBREW_TAP_APP_PRIVATE_KEY.
      - name: Generate tap push token
        id: tap-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: thebrianlopez
          repositories: homebrew-runabout

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
