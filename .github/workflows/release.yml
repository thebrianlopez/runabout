name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # macos-latest required for ts-go (CGo + tree-sitter). All other binaries
  # are CGO_ENABLED=0 and cross-compile to linux from macOS via goreleaser.
  # Docker is NOT available on macOS runners  -  ECR push runs in the docker job.
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      # Generate a short-lived installation token (1h TTL) scoped to
      # homebrew-runabout only. Replaces the long-lived PAT approach.
      # App requires Contents:write on thebrianlopez/homebrew-runabout.
      # If vars.HOMEBREW_TAP_APP_ID is not configured, this step is skipped
      # and goreleaser runs with --skip homebrew so the binary release still lands.
      - name: Generate tap push token
        id: tap-token
        if: vars.HOMEBREW_TAP_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: thebrianlopez
          repositories: homebrew-runabout

      - name: Configure AWS credentials for APK signing key
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: runabout-release-${{ github.ref_name }}
          aws-region: us-east-1

      - name: Fetch APK signing key
        run: |
          aws secretsmanager get-secret-value \
            --secret-id runabout/apk-signing-key \
            --query SecretString \
            --output text > "/tmp/${{ secrets.APK_KEY_NAME }}"
          chmod 600 "/tmp/${{ secrets.APK_KEY_NAME }}"

      - name: Fetch GPG key for deb package signing
        run: |
          aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.APT_GPG_KEY_NAME }}" \
            --query SecretString \
            --output text > /tmp/apt-signing.key
          gpg --batch --import --dry-run /tmp/apt-signing.key
          echo "GPG key format validated"

      - name: Run goreleaser (with homebrew tap)
        if: vars.HOMEBREW_TAP_APP_ID != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --skip docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          APK_KEY_NAME: ${{ secrets.APK_KEY_NAME }}

      - name: Run goreleaser (skip homebrew - tap app not configured)
        if: vars.HOMEBREW_TAP_APP_ID == ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --skip docker --skip homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          APK_KEY_NAME: ${{ secrets.APK_KEY_NAME }}

  # Runs on ubuntu-latest where Docker is available. Downloads the pre-built
  # linux/arm64 binary from the GitHub release created above, then builds and
  # pushes the ECR image. Authenticates via OIDC (Workload Identity Federation)
  #  -  no stored AWS credentials. Role configured in terraform/github-oidc.tf.
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC / Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download linux/arm64 binary from release
        run: |
          mkdir -p /tmp/linkari-bin
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "runabout_*_linux_arm64.tar.gz" \
            --dir /tmp/linkari-bin
          tar -xzf /tmp/linkari-bin/runabout_*_linux_arm64.tar.gz \
            -C /tmp/linkari-bin linkari
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Authenticates via OIDC (Workload Identity Federation) - no stored AWS credentials.
      # Role: github-actions-runabout (thebrianlopez/runabout repo trust, ecr-push policy).
      # Configured in terraform/github-oidc.tf + terraform/ecr.tf.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: runabout-release-${{ github.ref_name }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: /tmp/linkari-bin
          file: cmd/linkari/Dockerfile.release
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/linkari:${{ github.ref_name }}
            ${{ secrets.ECR_REGISTRY }}/linkari:latest

  apk-repo:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: runabout-apk-${{ github.ref_name }}
          aws-region: us-east-1

      - name: Fetch APK signing key
        run: |
          aws secretsmanager get-secret-value \
            --secret-id runabout/apk-signing-key \
            --query SecretString \
            --output text > "/tmp/${{ secrets.APK_KEY_NAME }}"
          chmod 600 "/tmp/${{ secrets.APK_KEY_NAME }}"

      - name: Download and organize APK artifacts
        run: |
          mkdir -p /tmp/apk-staging /tmp/apk-repo/aarch64 /tmp/apk-repo/x86_64
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "runabout_*.apk" \
            --dir /tmp/apk-staging

          # Reorganize into Alpine layout: ${arch}/${name}-${version}.apk
          # goreleaser names: runabout_0.2.24_linux_arm64.apk
          # Alpine expects:  aarch64/runabout-0.2.24.apk
          #
          # APK files are concatenated gzip streams: [sig][control][data].
          # .PKGINFO is in the control segment. Use `abuild-info` inside
          # Alpine to extract metadata reliably, but since we're on Ubuntu
          # here, parse the goreleaser filename for arch and use the Alpine
          # container later to extract pkgname/pkgver from .PKGINFO.
          for apk_file in /tmp/apk-staging/*.apk; do
            filename=$(basename "$apk_file")
            if echo "$filename" | grep -q '_linux_arm64\.apk$'; then
              alpine_arch="aarch64"
            elif echo "$filename" | grep -q '_linux_amd64\.apk$'; then
              alpine_arch="x86_64"
            else
              echo "WARNING: skipping unknown arch: $filename"
              continue
            fi
            cp "$apk_file" "/tmp/apk-repo/${alpine_arch}/${filename}"
            echo "  staged: ${alpine_arch}/${filename}"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename APKs to Alpine convention and generate APKINDEX
        run: |
          # Extract public key on host so it can be mounted into /etc/apk/keys/
          openssl rsa -in "/tmp/${{ secrets.APK_KEY_NAME }}" -pubout \
            -out "/tmp/${{ secrets.APK_KEY_NAME }}.pub"
          # Copy public key into repo root for client trust bootstrap
          cp "/tmp/${{ secrets.APK_KEY_NAME }}.pub" /tmp/apk-repo/

          # Inside Alpine container: rename APKs using .PKGINFO metadata,
          # then generate and sign per-arch APKINDEX.
          # Alpine's tar handles concatenated gzip streams natively.
          docker run --rm \
            -v /tmp/apk-repo:/repo \
            -v "/tmp/${{ secrets.APK_KEY_NAME }}:/${{ secrets.APK_KEY_NAME }}:ro" \
            -v "/tmp/${{ secrets.APK_KEY_NAME }}.pub:/etc/apk/keys/${{ secrets.APK_KEY_NAME }}.pub:ro" \
            alpine:latest sh -c '
              apk add --quiet abuild &&
              for arch in aarch64 x86_64; do
                archdir="/repo/${arch}"
                [ -d "$archdir" ] || continue
                ls "$archdir"/*.apk 1>/dev/null 2>&1 || continue

                # Rename each APK from goreleaser naming to Alpine convention
                for apk_file in "$archdir"/*.apk; do
                  pkgname=$(tar -xzf "$apk_file" -O .PKGINFO 2>/dev/null | grep "^pkgname" | head -1 | cut -d= -f2 | tr -d " ")
                  pkgver=$(tar -xzf "$apk_file" -O .PKGINFO 2>/dev/null | grep "^pkgver" | head -1 | cut -d= -f2 | tr -d " ")
                  if [ -n "$pkgname" ] && [ -n "$pkgver" ]; then
                    target="${pkgname}-${pkgver}.apk"
                    if [ "$(basename "$apk_file")" != "$target" ]; then
                      mv "$apk_file" "$archdir/$target"
                      echo "  renamed: $(basename "$apk_file") -> ${arch}/${target}"
                    fi
                  else
                    echo "  WARNING: could not extract metadata from $(basename "$apk_file")"
                  fi
                done

                # Generate and sign APKINDEX for this arch
                cd "$archdir" &&
                apk index -o APKINDEX.unsigned.tar.gz *.apk &&
                abuild-sign -k "/${{ secrets.APK_KEY_NAME }}" APKINDEX.unsigned.tar.gz &&
                mv APKINDEX.unsigned.tar.gz APKINDEX.tar.gz &&
                echo "  ${arch}: APKINDEX generated and signed"
              done
            '

      - name: Upload APK repo to S3
        run: |
          aws s3 sync /tmp/apk-repo/ s3://${{ secrets.APK_S3_BUCKET }}/alpine/ \
            --exclude "*.unsigned.tar.gz"

  apt-repo:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: runabout-apt-${{ github.ref_name }}
          aws-region: us-east-1

      - name: Fetch GPG signing key from Secrets Manager
        run: |
          aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.APT_GPG_KEY_NAME }}" \
            --query SecretString \
            --output text > /tmp/apt-signing.key
          gpg --batch --import /tmp/apt-signing.key

      - name: Install APT repository tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Download .deb artifacts from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/apt-repo/pool/main/r/runabout
          gh release download "${GITHUB_REF_NAME}" --pattern "*_amd64.deb" --dir /tmp/apt-repo/pool/main/r/runabout
          gh release download "${GITHUB_REF_NAME}" --pattern "*_arm64.deb" --dir /tmp/apt-repo/pool/main/r/runabout

      - name: Generate APT repository metadata
        run: |
          mkdir -p /tmp/apt-repo/dists/stable/main/binary-amd64
          mkdir -p /tmp/apt-repo/dists/stable/main/binary-arm64
          cd /tmp/apt-repo
          dpkg-scanpackages -a amd64 pool/main/r/runabout /dev/null > dists/stable/main/binary-amd64/Packages
          dpkg-scanpackages -a arm64 pool/main/r/runabout /dev/null > dists/stable/main/binary-arm64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-arm64/Packages
          apt-ftparchive release dists/stable \
            -o APT::FTPArchive::Release::Origin=runabout \
            -o APT::FTPArchive::Release::Label=runabout \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            > dists/stable/Release
          gpg --batch --yes --clearsign --output dists/stable/InRelease dists/stable/Release

      - name: Export GPG public key
        run: |
          gpg --armor --export > /tmp/apt-repo/key.gpg

      - name: Sync APT repo to S3
        run: |
          aws s3 sync /tmp/apt-repo/pool/ s3://${{ secrets.APK_S3_BUCKET }}/apt/pool/ --cache-control "max-age=86400"
          aws s3 sync /tmp/apt-repo/dists/ s3://${{ secrets.APK_S3_BUCKET }}/apt/dists/ --cache-control "max-age=300"
          aws s3 cp /tmp/apt-repo/key.gpg s3://${{ secrets.APK_S3_BUCKET }}/apt/key.gpg --cache-control "max-age=300"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/apt/dists/*" "/apt/key.gpg"

  apt-smoke-test:
    name: Smoke test APT install (debian:bookworm)
    needs: apt-repo
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Smoke test apt install runabout
        run: |
          docker run --rm debian:bookworm sh -c '
            set -e
            apt-get update -q
            apt-get install -y -q curl gpg
            curl -fsSL https://blo.la/apt/key.gpg | gpg --dearmor -o /usr/share/keyrings/runabout.gpg
            echo "deb [signed-by=/usr/share/keyrings/runabout.gpg] https://blo.la/apt stable main" > /etc/apt/sources.list.d/runabout.list
            apt-get update -q
            apt-get install -y -q runabout
            mdq --version
          '
