# nfpm.termux.yaml - standalone packaging config for Termux-native runabout
# Intended for a separate Termux repo publish job, not GitHub Release assets.
# Build inputs should be produced first (for example via goreleaser build --snapshot)
# and staged under dist/bin/ before invoking nfpm.

name: runabout
version: ${VERSION}
arch: arm64
platform: linux
maintainer: Brian Lopez <noreply@thebrianlopez.dev>
description: Personal developer tools - Termux-native package lane
homepage: https://github.com/thebrianlopez/runabout
license: MIT

contents:
  - src: dist/bin/mdq
    dst: /data/data/com.termux/files/usr/bin/mdq
    file_info:
      mode: 0755

  - src: dist/bin/perfgate
    dst: /data/data/com.termux/files/usr/bin/perfgate
    file_info:
      mode: 0755

  - src: dist/bin/shellprof
