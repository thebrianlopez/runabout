# Durable storage for the linkari server on K3S (local-path provisioner).
#
# Contains:
#   queue.db      -  SQLite queue/archive/feedback database
#   tsnet/        -  Tailscale node state (persisted so the node doesn't re-register
#                  on every pod restart, which consumes Tailscale auth key quota)
#   transcripts/  -  Image/PDF extracted text cache (optional, can be rebuilt)
#
# local-path uses the node's local filesystem. Data survives pod restarts but
# NOT node replacement. Acceptable for single-node K3S self-hosted deployment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkari-data
  namespace: linkari
  labels:
    app.kubernetes.io/part-of: linkari
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
