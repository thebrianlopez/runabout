# EPIC-038 M3: OrbStack configuration for gVisor dev runtime on macOS
#
# OrbStack alternative to Lima for developers who prefer the OrbStack UI.
# OrbStack uses Apple Virtualization.framework under the hood (same as Lima vz).
#
# OrbStack does not natively support gVisor as of v1.9 — this config adds
# containerd and runsc on top of the OrbStack Linux machine.
#
# Prerequisites:
#   brew install orbstack
#   orb create ubuntu:24.04 linkari-gvisor
#
# Apply this config:
#   orb push infra/orbstack-config.toml linkari-gvisor:/tmp/orbstack-config.toml
#   orb run linkari-gvisor -- bash /tmp/orbstack-config.toml
#
# Note: OrbStack machines share the host network by default. No extra
# network configuration is needed for api.anthropic.com access.

[machine]
name = "linkari-gvisor"
distro = "ubuntu:24.04"
arch = "x86_64"

# CPU and memory — OrbStack auto-scales; these are suggested minimums.
cpus = 4
memory = "8GiB"

[mounts]
# Host ~/tmp/linkari-io is shared into the VM at /tmp/linkari-io.
# Matches the Lima mount point so ContainerRuntime code is path-agnostic.
"~/tmp/linkari-io" = "/tmp/linkari-io"

[setup]
# The script below is idempotent. Run it inside the OrbStack machine to
# install containerd + gVisor runsc, mirroring the Lima provision block.
script = """
#!/bin/bash
set -euo pipefail

# containerd
apt-get update -qq
apt-get install -y -qq containerd ca-certificates curl
mkdir -p /etc/containerd
containerd config default > /etc/containerd/config.toml

# gVisor runsc
ARCH=$(uname -m)
GVISOR_VERSION=20240305.0
GVISOR_URL="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_VERSION}/${ARCH}/runsc"
mkdir -p /opt/gvisor
curl -fsSL -o /opt/gvisor/runsc "${GVISOR_URL}"
chmod 755 /opt/gvisor/runsc

# Register runsc runtime with containerd
cat >> /etc/containerd/config.toml <<'EOF'

[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
  runtime_type = "io.containerd.runsc.v1"

[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc.options]
  TypeUrl = "io.containerd.runsc.v1.options"
  BinaryName = "/opt/gvisor/runsc"
EOF

systemctl restart containerd
systemctl enable containerd

# I/O tmpfs
mkdir -p /tmp/linkari-io
chmod 1777 /tmp/linkari-io

# nerdctl
NERDCTL_VERSION=1.7.7
curl -fsSL "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz" \
  | tar -xz -C /usr/local/bin nerdctl
chmod 755 /usr/local/bin/nerdctl

echo "✅ OrbStack gVisor setup complete"
/opt/gvisor/runsc --version
"""
