---
# EPIC-038 M8: gVisor RuntimeClass for EKS.
#
# Apply this manifest to register the gVisor runsc runtime handler with the
# Kubernetes API server. Pods that request this RuntimeClass will be scheduled
# only on nodes that have the gVisor RuntimeClass handler installed.
#
# Prerequisites on each EKS worker node:
#   1. containerd configured with [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
#   2. /usr/local/bin/runsc (or the path configured in containerd.toml)
#   3. Node label: linkari.grindr.com/gvisor=true  (for scheduling affinity)
#
# Apply:
#   kubectl --context grindr-<env>-eks apply -f infra/k8s-runtimeclass-gvisor.yaml
#
# Validate:
#   kubectl --context grindr-<env>-eks get runtimeclass gvisor -o yaml
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/part-of: linkari
    app.kubernetes.io/managed-by: runabout-agent
handler: runsc
scheduling:
  # Only schedule gVisor pods on nodes that have the runsc handler installed.
  # Nodes must carry this label — apply it during node bootstrap:
  #   kubectl label node <node> linkari.grindr.com/gvisor=true
  nodeClassification:
    tolerations:
      - key: "linkari.grindr.com/gvisor"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
overhead:
  # gVisor has ~10% memory overhead vs runc due to the sentry process.
  # This ensures the scheduler accounts for it when bin-packing pods.
  podFixed:
    memory: "100Mi"
