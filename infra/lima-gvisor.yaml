# EPIC-038 M3: Lima VM configuration for gVisor dev runtime on macOS
#
# Boots an Ubuntu 24.04 VM via Virtualization.framework with:
#   - containerd 1.7+ pre-installed
#   - gVisor runsc + containerd-shim-runsc-v1 installed at /opt/gvisor/
#   - Shared I/O tmpfs at /tmp/linkari-io (bind-mounted from host)
#   - containerd UNIX socket forwarded to ~/.lima/lima-gvisor/containerd.sock
#
# Usage:
#   limactl start infra/lima-gvisor.yaml
#   limactl shell lima-gvisor
#
# After VM start, set in server.yaml:
#   sandbox.runtime_socket: ~/.lima/lima-gvisor/containerd.sock
#
# Requires Lima ≥ 0.21 (Apple Virtualization.framework support).

vmType: vz                 # Apple Virtualization.framework — native ARM64, full performance
arch: aarch64              # Native on Apple Silicon; vz requires native arch (no cross-arch)

cpus: 4
memory: "8GiB"
disk: "30GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64

mounts:
  # Host ~/tmp/linkari-io is shared into the VM at /tmp/linkari-io.
  # ContainerRuntime mounts per-invocation subdirs from here.
  - location: "~/tmp/linkari-io"
    mountPoint: "/tmp/linkari-io"
    writable: true

# Forward the guest containerd UNIX socket to the host so the linkari Go
# binary (running on macOS) can reach containerd without SSH tunnelling.
# {{.Dir}} expands to ~/.lima/lima-gvisor/ at VM start time.
portForwards:
  - guestSocket: "/run/containerd/containerd.sock"
    hostSocket: "{{.Dir}}/containerd.sock"

networks:
  - lima: user-v2            # NAT — containers can reach api.anthropic.com

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail

      # ── containerd ──────────────────────────────────────────────────────────
      apt-get update -qq
      apt-get install -y -qq containerd ca-certificates curl gnupg

      mkdir -p /etc/containerd
      containerd config default > /etc/containerd/config.toml

      # ── gVisor runsc + containerd shim ──────────────────────────────────────
      ARCH=$(uname -m)   # aarch64 on Apple Silicon
      GVISOR_VERSION=20240305.0
      GVISOR_BASE="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_VERSION}/${ARCH}"
      mkdir -p /opt/gvisor

      # runsc: the gVisor sandbox binary.
      curl -fsSL -o /opt/gvisor/runsc "${GVISOR_BASE}/runsc"
      chmod 755 /opt/gvisor/runsc

      # containerd-shim-runsc-v1: containerd invokes this shim to start gVisor tasks.
      # Must be discoverable in PATH; /usr/local/sbin is on containerd's default search.
      curl -fsSL -o /usr/local/sbin/containerd-shim-runsc-v1 \
        "${GVISOR_BASE}/containerd-shim-runsc-v1"
      chmod 755 /usr/local/sbin/containerd-shim-runsc-v1

      # Register runsc as a containerd runtime.
      cat >> /etc/containerd/config.toml <<'EOF'

      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
        runtime_type = "io.containerd.runsc.v1"

      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc.options]
        TypeUrl = "io.containerd.runsc.v1.options"
        BinaryName = "/opt/gvisor/runsc"
      EOF

      systemctl restart containerd
      systemctl enable containerd

      # ── I/O tmpfs ───────────────────────────────────────────────────────────
      mkdir -p /tmp/linkari-io
      chmod 1777 /tmp/linkari-io

      # ── nerdctl (containerd CLI) ─────────────────────────────────────────────
      NERDCTL_VERSION=1.7.7
      # Normalize uname -m → Go/GitHub release arch name (aarch64 → arm64).
      NERDCTL_ARCH=$(uname -m | sed 's/aarch64/arm64/;s/x86_64/amd64/')
      curl -fsSL "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-${NERDCTL_ARCH}.tar.gz" \
        | tar -xz -C /usr/local/bin nerdctl
      chmod 755 /usr/local/bin/nerdctl

  - mode: user
    script: |
      #!/bin/bash
      # Smoke-test: verify runsc is reachable and containerd is running.
      /opt/gvisor/runsc --version
      /usr/local/sbin/containerd-shim-runsc-v1 -version
      systemctl is-active containerd

probes:
  - description: "containerd is active"
    script: systemctl is-active containerd
    hint: "containerd did not start — check `limactl shell lima-gvisor systemctl status containerd`"
  - description: "runsc is executable"
    script: /opt/gvisor/runsc --version
    hint: "gVisor runsc not installed — check provision logs"
  - description: "containerd-shim-runsc-v1 is installed"
    script: /usr/local/sbin/containerd-shim-runsc-v1 -version
    hint: "gVisor shim not installed — check provision logs (GVISOR_BASE URL)"
